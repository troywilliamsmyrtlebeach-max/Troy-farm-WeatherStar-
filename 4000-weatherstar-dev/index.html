<script>
"use strict";

  ],

  ]

var DATA = JSON.parse(JSON.stringify(FALLBACK));

/* ---------------- conversions (whole numbers, round half-up) -------- */
function rhu(x) { return Math.floor(x + 0.5); }
function cToF(c) { return rhu(c * 9 / 5 + 32); }
function kmhToMph(v) { return rhu(v * 0.621371); }
function hpaToInhg(v) { return (v * 0.02953).toFixed(2); }
var SKY_WORDS = { 0: "CLEAR", 1: "FAIR", 2: "P CLOUDY", 3: "M CLOUDY" };
function skyWord(code) {
  if (typeof code === "number") return SKY_WORDS[code] || "CLEAR";
  return String(code || "CLEAR").toUpperCase();
}
function farmFromChannel(fd) {
  // Channel farm-data.json is metric: temp/feels/dew in C, wind km/h,
  // pressure hPa. windSpeed is the RAW sustained speed and windGust the
  // RAW gust — the refresh cron does NOT stage a rule value. Troy's
  // 2026-11-16 wind rule is applied here in-page: gust below 16 mph ->
  // show the HIGHER of sustained/gust, ONE number, NO gust wording.
  // Gust 16+ -> sustained (lower) first, then the gust. Both 0 -> CALM.
  var trend = (fd.pressureTrend || "steady").toLowerCase();
  var letter = trend === "falling" ? "F" : trend === "rising" ? "R" : "S";
  var sustMph = kmhToMph(fd.windSpeed || 0);
  var gustMph = kmhToMph(fd.windGust || 0);
  var windMph = gustMph >= 16 ? sustMph : Math.max(sustMph, gustMph);
  var windGust = gustMph >= 16 ? gustMph : 0;
  return {
    tempF: cToF(fd.temperature), feelsF: cToF(fd.feelsLike),
    dewF: cToF(fd.dewPoint), rh: fd.humidity,
    pressure: hpaToInhg(fd.pressure), trend: letter,
    windDir: fd.windDirection || "Calm",
    windMph: windMph, windGust: windGust,
    rainToday: (fd.rainTodayIn || 0).toFixed(2),
    sky: skyWord(fd.conditionText),
    visib: fd.visibility != null ? rhu(fd.visibility * 0.621371) : 10,
    ceiling: DATA.farm.ceiling, novPrecip: DATA.farm.novPrecip
  };
}
function windText(row) {
  // Farm row (Latest Hourly Observations): direction + number only, NO
  // "MPH" (Troy 2026-11-16 wind rule). At gust 16+ the farm row shows
  // sustained first, then "Gusts to <gust>". Regional rows keep the
  // sustained-only " MPH" form. Both 0 -> CALM.
  if (!row.windMph && !(row.windGust && row.windGust >= 16)) return "CALM";
  if (row.name === "CALABASH-FARM") {
    if (row.windGust && row.windGust >= 16) {
      return row.windMph > 0 ? (row.windDir + " " + row.windMph + " Gusts to " + row.windGust) : ("Gusts to " + row.windGust);
    }
    return row.windDir + " " + row.windMph;
  }
  return row.windDir + " " + row.windMph + " MPH";
}

/* ---------------- live data fetch (keeps last good on failure) ------ */
function fetchJSON(url) {
  return fetch(url, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
}
function loadData() {
  fetchJSON("../4000-myrtle-intl/farm-data.json")
    .catch(function () { return fetchJSON("farm-data.json"); })
    .then(function (fd) { DATA.farm = farmFromChannel(fd); renderCurrent(); })
    .catch(function () { /* keep fallback */ });
  fetchJSON("local-forecast.json").then(function (j) {
    if (j.TODAY) DATA.forecast.TODAY = { name: "TODAY", text: j.TODAY.text };
    if (j.TONIGHT) DATA.forecast.TONIGHT = { name: "TONIGHT", text: j.TONIGHT.text };
    if (j.TOMORROW) DATA.forecast.TOMORROW = { name: "TOMORROW", text: j.TOMORROW.text };
    if (j.extendedPeriods) {
      var days = {}, order = [];
      // NWS names the first periods "Overnight"/"Today"/"Tonight" depending
      // on the hour: "Overnight" is the night just ended (its low is NOT
      // today's LO — skip it); "Today"/"Tonight" both belong to today.
      var todayKey = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][new Date().getDay()];
      j.extendedPeriods.forEach(function (p) {
        var nm = p.name;
        if (/^overnight$/i.test(nm)) return;
        var key = /^(today|tonight)$/i.test(nm) ? todayKey
          : nm.replace(" Night", "").toUpperCase().slice(0, 3);
        if (!days[key]) { days[key] = { day: key, word: p.short, lo: null, hi: null }; order.push(key); }
        if (p.isDaytime) { days[key].hi = p.temp; if (!days[key].word) days[key].word = p.short; }
        else days[key].lo = p.temp;
      });
      var ext = order.map(function (k) { return days[k]; })
        .filter(function (e) { return e.hi != null && e.lo != null; }).slice(0, 3);
      if (ext.length === 3) DATA.extended = ext;
    }
  }).catch(function () {});
  fetchJSON("regional-metars.json").then(function (j) {
    if (j.hourly && j.hourly.length) DATA.hourly = [{ name: "CALABASH-FARM", tempF: DATA.farm.tempF, sky: DATA.farm.sky, windDir: DATA.farm.windDir, windMph: DATA.farm.windMph, windGust: DATA.farm.windGust }].concat(j.hourly);
    if (j.region && j.region.length) DATA.region = j.region;
    if (j.novemberPrecipIn != null) DATA.farm.novPrecip = j.novemberPrecipIn;
  }).catch(function () {});
  fetchJSON("travel-cities.json").then(function (j) {
    if (j.cities && j.cities.length === 24) DATA.travel = j.cities;
  }).catch(function () {});
  fetchJSON("forecast-region.json").then(function (j) {
    if (j.towns && j.towns.length) DATA.forecastRegion = j.towns;
  }).catch(function () {});
}

/* ---------------- scaler (single scaler, like the Channel) ---------- */
var stage = document.getElementById("stage");
function fit() {
  var s = Math.min(window.innerWidth / 1327, window.innerHeight / 998);
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
window.addEventListener("resize", fit);
fit();

/* ---------------- clock + date (no leading zero on the hour) -------- */
var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
var MONS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function tickClock() {
  var d = new Date();
  var h = d.getHours() % 12 || 12;
  var ap = d.getHours() < 12 ? "AM" : "PM";
  document.getElementById("ftime").textContent = h + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()) + " " + ap;
  document.getElementById("fdate").textContent = DAYS[d.getDay()] + " " + MONS[d.getMonth()] + " " + d.getDate();
}
setInterval(tickClock, 1000);
tickClock();

/* ---------------- footer line 2 (rotates independently) ------------- */
var fitems = 0, scrollTurn = 0;
function footerItems() {
  var f = DATA.farm;
  return [
    f.sky,
    "TEMP: " + f.tempF + "\u00B0F   WND CHILL: " + f.feelsF + "\u00B0F",
    "WIND: " + (f.windMph ? f.windDir + " " + f.windMph + " MPH" : "CALM"),
    "HUMIDITY: " + f.rh + "%   DEWPOINT: " + f.dewF + "\u00B0F",
    "VISIB: " + f.visib + " MI.   CEILING: " + f.ceiling,
    "BAROMETRIC PRESSURE: " + f.pressure + " " + f.trend,
    "NOVEMBER PRECIPITATION: " + Number(f.novPrecip).toFixed(2) + " IN",
    "CONDITIONS AT CALABASH-FARM AT BRUNSWICK"
  ];
}
var SCROLL_LINES = [
  "CONDITIONS AT CALABASH-FARM AT BRUNSWICK \u2022 TROY'S WEATHER AT THE FARM \u2022 ",
  "TROY'S WEATHER AT CALABASH-FARM AT BRUNSWICK \u2022 FARM CONDITIONS UPDATED EVERY 15 MINUTES \u2022 "
];
function tickFooter() {
  var line2 = document.getElementById("fline2");
  scrollTurn++;
  if (scrollTurn % 4 === 0) {
    var msg = SCROLL_LINES[(scrollTurn / 4 | 0) % SCROLL_LINES.length];
    line2.className = "scroll";
    line2.innerHTML = "<span>" + msg + msg + "</span>";
  } else {
    var items = footerItems();
    line2.className = "line2";
    line2.textContent = items[fitems % items.length];
    fitems++;
  }
}
setInterval(tickFooter, 4000);
tickFooter();

/* ---------------- screens ------------------------------------------- */
var screenEl = document.getElementById("screen");
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function titleHtml(t, two) {
  return '<div class="title' + (two ? " two" : "") + '" data-fit="1">' + esc(t) + "</div>";
}
function fitTitles() {
  var els = screenEl.querySelectorAll("[data-fit]");
  for (var i = 0; i < els.length; i++) {
    var el = els[i], size = parseInt(getComputedStyle(el).fontSize, 10);
    el.style.whiteSpace = "nowrap";
    while (el.scrollWidth > 1267 && size > 24) { size -= 2; el.style.fontSize = size + "px"; }
  }
}
function condRows() {
  var f = DATA.farm;
  return [
    ["TEMP:", f.tempF + "\u00B0F"],
    ["WND CHILL:", f.feelsF + "\u00B0F"],
    ["WIND:", (f.windGust && f.windGust >= 16) ? (f.windMph > 0 ? f.windDir + " " + f.windMph + " MPH, Gusts to " + f.windGust + " MPH" : "Gusts to " + f.windGust + " MPH") : (f.windMph ? f.windDir + " " + f.windMph + " MPH" : "CALM")],
    ["HUMID:", f.rh + "%"],
    ["DEWPT:", f.dewF + "\u00B0F"],
    ["CEILING:", f.ceiling],
    ["VISIB:", f.visib + " MI."],
    ["BAROMETRIC PRESSURE:", f.pressure + " " + f.trend],
    ["NOVEMBER PRECIPITATION:", Number(f.novPrecip).toFixed(2) + " IN"],
    ["SKY:", f.sky]
  ];
}
function renderConditions() {
  var rows = condRows().map(function (r) {
    return '<div class="row">' + r[0] + " " + r[1] + "</div>";
  }).join("");
  screenEl.innerHTML = titleHtml("CONDITIONS AT CALABASH-FARM AT BRUNSWICK", true) +
    '<div class="body"><div class="cond-col">' + rows + "</div></div>";
  fitTitles();
}
function obsTable(rows, cols) {
  var h = '<table class="data">';
  rows.forEach(function (r) {
    h += "<tr><td>" + esc(r.name) + "</td>";
    if (cols.indexOf("temp") >= 0) h += '<td class="num">' + r.tempF + "</td>";
    if (cols.indexOf("sky") >= 0) h += "<td>" + esc(r.sky) + "</td>";
    if (cols.indexOf("wind") >= 0) h += "<td>" + esc(windText(r)) + "</td>";
    h += "</tr>";
  });
  return h + "</table>";
}
function renderHourly() {
  screenEl.innerHTML = titleHtml("LATEST HOURLY OBSERVATIONS") +
    '<div class="body">' + obsTable(DATA.hourly, ["temp", "sky", "wind"]) + "</div>";
  fitTitles();
}
function renderRegion() {
  screenEl.innerHTML = titleHtml("CONDITIONS ACROSS THE REGION") +
    '<div class="body">' + obsTable(DATA.region, ["sky", "temp", "wind"]) + "</div>";
  fitTitles();
}
function renderForecast(which) {
  var p = DATA.forecast[which];
  screenEl.innerHTML = titleHtml("YOUR TWC FORECAST") +
    '<div class="ftext">' + esc(p.name) + "..." + esc(p.text) + "</div>";
  fitTitles();
}
function renderForecastRegion() {
  var rows = DATA.forecastRegion.map(function (t) {
    return "<tr><td>" + esc(t.name) + "</td><td>" + esc(t.word) + "</td>" +
      '<td class="num">' + t.lo + "/" + t.hi + "</td></tr>";
  }).join("");
  screenEl.innerHTML = titleHtml("FORECAST ACROSS THE REGION") +
    '<div class="body"><table class="data">' + rows + "</table></div>";
  fitTitles();
}
function renderExtended() {
  var h = titleHtml("EXTENDED FORECAST");
  DATA.extended.forEach(function (e) {
    h += '<div class="ext-row">' + esc(e.day) + " " + esc(e.word) +
      ' &nbsp; LO <span class="lo">' + e.lo + "</span> &nbsp; HI " + e.hi + "</div>";
  });
  screenEl.innerHTML = h;
  fitTitles();
}
function renderTravelTitle() {
  stage.classList.add("grey");
  screenEl.innerHTML = '<div class="travel-title">TRAVEL CITIES<br>FORECAST</div>';
}
var travelTimer = null, travelStep = 0;
function renderTravel() {
  stage.classList.remove("grey");
  var rows = DATA.travel.map(function (c) {
    return "<tr><td>" + esc(c.name) + "</td><td>" + esc(c.word) + "</td>" +
      '<td class="num">' + c.hi + "/" + c.lo + "</td></tr>";
  }).join("");
  screenEl.innerHTML = titleHtml("TRAVEL CITIES FORECAST") +
    '<div id="travel-view"><div id="travel-inner"><table class="data">' + rows + "</table></div></div>";
  fitTitles();
  var inner = document.getElementById("travel-inner");
  var maxStep = Math.max(0, DATA.travel.length - 8);
  travelStep = 0;
  var firstRow = inner.querySelector("tr");
  var rowH = firstRow ? firstRow.offsetHeight : 72;
  if (travelTimer) clearInterval(travelTimer);
  travelTimer = setInterval(function () {
    travelStep = (travelStep + 1) % (maxStep + 1);
    inner.style.transform = "translateY(" + (-travelStep * rowH) + "px)";
  }, 1400);
}
function renderOutlook() {
  screenEl.innerHTML = titleHtml("NAT'L WEATHER SERVICE OUTLOOK") +
    '<div class="outlook">NOVEMBER<br><br>NO REPORT</div>';
  fitTitles();
}
function renderGap() {
  stage.classList.add("grey");
  screenEl.innerHTML = "";
}
function renderLoading() {
  screenEl.innerHTML =
    '<div class="loading"><div class="big">LOADING DATA<br>PLEASE STAND BY</div>' +
    '<div class="credit">SIMULATOR BY MIST WEATHER MEDIA. CODE/PICTURES ALMOST COMPLETELY BY JOE MOLINELLI, WITH HELP OF SOME OPEN SOURCE PROJECTS. GRAPHICAL VERSION COMING IN NEXT FEW MONTHS.</div>' +
    '<div class="farmline">TROY\u2019S FARM VERSION \u2014 CONDITIONS AT CALABASH-FARM AT BRUNSWICK</div></div>';
}
function renderCurrent() {
  if (currentScreen === renderConditions) renderConditions();
}

/* ---------------- cycle (typical order; ~110-150 s loop) ------------ */
var SCREENS = [
  [renderConditions, 12000],
  [renderHourly, 12000],
  [renderRegion, 12000],
  [function () { renderForecast("TODAY"); }, 12000],
  [function () { renderForecast("TONIGHT"); }, 12000],
  [function () { renderForecast("TOMORROW"); }, 12000],
  [renderForecastRegion, 12000],
  [renderExtended, 12000],
  [renderTravelTitle, 4000],
  [renderTravel, 22000],
  [renderOutlook, 10000],
  [renderGap, 3000]
];
var currentScreen = null, screenIdx = 0;
function showScreen(i) {
  screenIdx = i % SCREENS.length;
  var fn = SCREENS[screenIdx][0], dur = SCREENS[screenIdx][1];
  currentScreen = fn;
  stage.classList.remove("grey");
  if (travelTimer) { clearInterval(travelTimer); travelTimer = null; }
  fn();
  setTimeout(function () { showScreen(screenIdx + 1); }, dur);
}

/* ---------------- boot ------------------------------------------------ */
loadData();
renderLoading();
setTimeout(function () { showScreen(0); }, 3500);
setInterval(loadData, 15 * 60 * 1000);
</script>
</body>
</html>
